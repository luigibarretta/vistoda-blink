name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: luigibarretta/vistoda-provider-kit
          ref: 9f0a48b39a184f1755a3cd051a26b4054c8a7541
          path: .ci/vistoda-provider-kit
      - name: Verify pinned Vistoda provider kit
        run: |
          pin="$(tr -d '[:space:]' < dependencies/vistoda-provider-kit.sha)"
          test "${pin}" = "9f0a48b39a184f1755a3cd051a26b4054c8a7541"
          test "$(git -C .ci/vistoda-provider-kit rev-parse HEAD)" = "${pin}"
          cmp .ci/vistoda-provider-kit/dist/vistoda-app-bootstrap.sh \
            addon/vistoda_blink_engine/rootfs/vistoda-app-bootstrap.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q custom_components tests scripts
      - run: python scripts/check_loc.py
      - run: python -m pytest
