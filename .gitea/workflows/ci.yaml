name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the exact provider kit from the public source of truth
        run: |
          git init .ci/vistoda-provider-kit
          git -C .ci/vistoda-provider-kit remote add origin https://github.com/luigibarretta/lib-vistoda-provider-kit.git
          git -C .ci/vistoda-provider-kit fetch --depth=1 origin 4f6c74125a673cb9836471122ae0007938b86619
          git -C .ci/vistoda-provider-kit checkout --detach FETCH_HEAD
      - name: Verify pinned Vistoda provider kit
        run: |
          pin="$(tr -d '[:space:]' < dependencies/vistoda-provider-kit.sha)"
          test "${pin}" = "4f6c74125a673cb9836471122ae0007938b86619"
          test "$(git -C .ci/vistoda-provider-kit rev-parse HEAD)" = "${pin}"
          cmp .ci/vistoda-provider-kit/dist/vistoda-app-bootstrap.sh \
            addon/vistoda_blink_engine/rootfs/vistoda-app-bootstrap.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q custom_components tests scripts
      - run: python scripts/check_loc.py
      - run: python scripts/check-release.py
      - run: python -m pytest
      # Use a reachable mainline action commit; version branches are rewritten upstream.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: addon/vistoda_blink_engine
      - run: cargo fmt --manifest-path addon/vistoda_blink_engine/Cargo.toml --check
      - run: cargo clippy --manifest-path addon/vistoda_blink_engine/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path addon/vistoda_blink_engine/Cargo.toml --locked
