name: ci
on:
  push:
    branches: [main]
  pull_request:
# Checks come from ci-local.json through the vendored ci-local runner, the same
# entry point used before a push (`node third_party/repo-tooling/ci-local.mjs
# --quick`, then the full gate). Every manifest step runs in exactly one call
# below (scripts/check_ci_local_jobs.py). Plain workflow steps are CI-only:
# checkouts, the repo-tooling pin check, Python and Rust toolchains, caches,
# the dev-dependency install and cargo-audit installation.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI-only: verifies third_party/repo-tooling against a checkout of the
      # commit pinned in dependencies/repo-tooling.sha.
      - name: Checkout pinned repository tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luigibarretta/repo-tooling
          ref: 7c1288562bb7ae8c5e111cf7da965cc69830cdd7
          path: .ci/repo-tooling
      - name: Verify pinned repository tooling
        run: scripts/check-repo-tooling-sync.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the adapter's development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      # The provider-kit step fetches lib-vistoda-provider-kit at
      # dependencies/vistoda-provider-kit.sha from its public source of truth.
      - name: Job ownership, provider kit, Python adapter checks, LOC and release identity
        run: node third_party/repo-tooling/ci-local.mjs --ci --only ci-local-jobs,provider-kit,python-format,python-lint,python-compile,loc,release-check,pytest
      # Use a reachable mainline action commit; version branches are rewritten upstream.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: addon/vistoda_blink_engine
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Reviewed exceptions live in .cargo/audit.toml, which GitHub's audit-check
      # reads; the audit-lockfiles step repeats them (checked by ci-local-jobs).
      - name: Engine rustfmt, dependency audit, clippy and tests
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-fmt,audit-lockfiles,rust-clippy,rust-test
  secret-scan:
    # Mirrors the GitHub secret-scan job without GitHub's API: the secret-scan
    # step installs gitleaks at a pinned version and checksum and scans the
    # full history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: node third_party/repo-tooling/ci-local.mjs --ci --only secret-scan
