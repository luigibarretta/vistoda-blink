name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

# Checks come from ci-local.json through the vendored ci-local runner, as in
# .gitea/workflows/ci.yaml; this workflow never repeats a manifest command
# (repo-tooling consumer contract). Plain steps are GitHub-only: checkouts,
# toolchains, caches, dependency and cargo-audit installation, the release
# build, gitleaks-action, HACS, hassfest, the add-on linter and the image build.
jobs:
  provider-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # provider-kit fetches lib-vistoda-provider-kit at
      # dependencies/vistoda-provider-kit.sha (dependencies/vendored.json).
      - name: Exact bootstrap dependency and kit lifecycle test
        run: node third_party/repo-tooling/ci-local.mjs --ci --only provider-kit,provider-kit-test,auth-modules-vendor

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # repo-tooling-sync runs on Gitea only: the repo-tooling mirror on GitHub
      # is private, so this public workflow cannot check it out.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the adapter's development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Job ownership, vendored tooling, Python adapter checks, LOC and NASA ratchets
        run: node third_party/repo-tooling/ci-local.mjs --ci --only ci-local-jobs,python-format,python-lint,python-compile,loc,nasa,pytest
      # Same reachable mainline action commit as Gitea CI; version branches are rewritten upstream.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: addon/vistoda_blink_engine
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Engine rustfmt, dependency audit, clippy and tests
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-fmt,audit-lockfiles,rust-clippy,rust-test
      # GitHub-only: the release build of the engine (MSRV 1.88).
      - run: cargo build --manifest-path addon/vistoda_blink_engine/Cargo.toml --locked --release
  hacs:
    # HACS default-list requirement: must pass with no ignored checks.
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: ./addon/vistoda_blink_engine
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Release identity across the adapter, app and engine
        run: node third_party/repo-tooling/ci-local.mjs --ci --only release-check
      - name: Build the app image at the declared version
        # Runs on the same checkout as the tag-triggered release workflow.
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' addon/vistoda_blink_engine/Cargo.toml | head -1)"
          test -n "${version}"
          docker build \
            --build-arg "BUILD_VERSION=${version}" \
            --build-arg BUILD_ARCH=amd64 \
            --tag vistoda-blink-addon:test \
            addon/vistoda_blink_engine
