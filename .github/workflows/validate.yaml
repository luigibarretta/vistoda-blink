name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m compileall -q custom_components tests scripts
      - run: python scripts/check_loc.py
      - run: python -m pytest
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: addon/vistoda_blink_engine
      - run: cargo fmt --manifest-path addon/vistoda_blink_engine/Cargo.toml --check
      - run: cargo clippy --manifest-path addon/vistoda_blink_engine/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path addon/vistoda_blink_engine/Cargo.toml --locked
      - run: cargo build --manifest-path addon/vistoda_blink_engine/Cargo.toml --locked --release
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: addon/vistoda_blink_engine
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
