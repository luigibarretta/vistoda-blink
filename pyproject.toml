[project]
name = "vistoda-blink"
version = "0.3.1"
description = "Standalone Rust-first Blink provider for Vistoda and Home Assistant"
requires-python = ">=3.13"
license = "MIT"

[project.optional-dependencies]
dev = [
  "aiohttp>=3.12,<4",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "ruff==0.15.12",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
