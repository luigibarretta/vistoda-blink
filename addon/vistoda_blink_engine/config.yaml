# Development copy for local builds (slug vistoda_blink_engine, legacy `token`
# migration). The published app, its DOCS and option texts live in the
# vistoda-addons catalog (vistoda_blink); keep user-facing text in sync there.
name: Vistoda Blink Engine
version: 0.24.3
slug: vistoda_blink_engine
description: Standalone Rust Blink provider for Home Assistant and Vistoda
url: https://github.com/luigibarretta/vistoda-blink
arch:
  - amd64
  - aarch64
startup: services
init: false
hassio_api: true
discovery:
  - blink_live_bridge
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Private Vistoda Blink engine API
schema:
  token: match(^[0-9a-f]{64}$)?
