[package]
name = "vistoda-blink-engine"
version = "0.4.4"
edition = "2024"
rust-version = "1.88"
authors = ["Luigi Barretta"]
description = "Rust media data plane for Vistoda Blink"
license = "MIT"
repository = "https://git.luigibarretta.com/luigibarretta/vistoda-blink"

[dependencies]
aes-gcm = "0.10"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
implicit_hasher = "allow"
large_futures = "allow"
map_unwrap_or = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
semicolon_if_nothing_returned = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"
